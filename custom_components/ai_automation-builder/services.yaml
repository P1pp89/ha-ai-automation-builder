# Descrizioni servizi per Developer Tools → Services

install_ollama:
  description: "Installa Ollama automaticamente con modello specificato"
  fields:
    model:
      name: "Modello Ollama"
      description: "Modello da scaricare (phi3:mini, llama3.1, mistral)"
      required: false
      example: "phi3:mini"
      selector:
        text:

restart_ai:
  description: "Riavvia servizio AI (utile dopo cambio config)"
  fields: {}

build_automation:
  description: "Genera automazione da descrizione naturale"
  fields:
    prompt:
      name: "Descrizione"
      description: "Descrivi l'automazione in italiano/inglese"
      required: true
      example: "Accendi luce soggiorno quando entro casa"
      selector:
        text:
    language:
      name: "Lingua"
      description: "it / en"
      required: false
      default: "it"
      selector:
        select:
          options:
            - "it"
            - "en"

get_entities_suggestions:
  description: "Ottiene suggerimenti entità per automazioni"
  fields: {}

validate_yaml:
  description: "Valida YAML automazione"
  fields:
    yaml:
      name: "YAML"
      description: "Codice YAML da validare"
      required: true
      selector:
        textarea:
